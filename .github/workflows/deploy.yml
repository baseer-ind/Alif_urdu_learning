# Push-to-deploy: every push to main is tested and built, then deployed to Cloudflare.
# Pull requests run the same test + build gate but never deploy.
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
# The account is auto-detected from the token (it is scoped to one account). If
# your token ever covers multiple accounts, also add a CLOUDFLARE_ACCOUNT_ID
# secret and pass it in the Deploy step env.
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
  deploy:
    # Only runs after verify succeeds, and only for main (never for PRs or
    # manual runs started from another branch).
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --config .output/server/wrangler.json
  # TEMPORARY: gate probe for PR verification only. Reverted before merge.
  gate-probe:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "verify succeeded; a deploy job with needs:verify would be allowed to run"
